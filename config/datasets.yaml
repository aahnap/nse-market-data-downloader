# ---------------------------------------------------------------------------
# Dataset configuration for the NSE Market Data Downloader.
#
# This file is intentionally kept separate from the application code
# (see requirement: "Keep dataset URLs/configuration separate from the
# main application logic"). To add a 5th dataset, add a new entry here --
# no code changes should be required.
#
# NOTE ON URLS: NSE's website pages (the "page_url" below) render their
# tables using data pulled from NSE's own internal JSON APIs (the
# "api_url" below). Those internal endpoints are not officially documented
# and NSE changes them from time to time. If a dataset starts failing with
# HTTP errors or "unexpected format" errors, this file is the first place
# to check / update -- that's the whole point of keeping it separate.
# ---------------------------------------------------------------------------

# Common settings applied to every request.
common:
  base_url: "https://www.nseindia.com"
  # NSE rejects requests that don't look like they came from a real browser.
  user_agent: >-
    Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
    (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36
  request_timeout_seconds: 15
  max_retries: 3
  backoff_base_seconds: 2      # 2s, 4s, 8s ...
  # A short pause before hitting the API, after the cookie warm-up call.
  warmup_pause_seconds: 1

datasets:
  top-gainers-losers:
    display_name: "Top Gainers / Losers"
    page_url: "https://www.nseindia.com/market-data/top-gainers-losers"
    # NSE serves gainers and losers as two separate calls; we combine them
    # into a single CSV with a "category" column so it maps 1:1 to the page.
    api_urls:
      gainers: "https://www.nseindia.com/api/live-analysis-variations?index=gainers"
      losers: "https://www.nseindia.com/api/live-analysis-variations?index=loosers"
    file_prefix: "top_gainers_losers"
    required_columns: ["symbol", "series", "ltp"]

  upper-band-hitters:
    display_name: "Upper Band Hitters"
    page_url: "https://www.nseindia.com/market-data/upper-band-hitters"
    api_urls:
      upper: "https://www.nseindia.com/api/live-analysis-price-band-hitter?bandtype=upper&view=AllSec"
    file_prefix: "upper_band_hitters"
    required_columns: ["symbol", "series"]

  volume-gainers-spurts:
    display_name: "Volume Gainers / Spurts"
    page_url: "https://www.nseindia.com/market-data/volume-gainers-spurts"
    api_urls:
      volume: "https://www.nseindia.com/api/live-analysis-volume-gainers"
    file_prefix: "volume_gainers_spurts"
    required_columns: ["symbol", "volume"]

  52-week-high:
    display_name: "52 Week High - Equity Market"
    page_url: "https://www.nseindia.com/market-data/52-week-high-equity-market"
    api_urls:
      high: "https://www.nseindia.com/api/live-analysis-data-52weekhighstock"
    file_prefix: "52_week_high"
    required_columns: ["symbol", "series"]
