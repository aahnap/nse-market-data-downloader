[project]
name = "nse-market-data-downloader"
version = "1.0.0"
description = "Automated downloader for NSE market-data CSV datasets"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7.4.0", "responses>=0.24.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
